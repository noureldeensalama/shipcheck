              - generic [ref=f2e494]:
                - link [ref=f2e495] [cursor=pointer]:
                  - /url: /noureldeensalama/shipcheck/blob/main/docs/logo.svg
                  - img "ShipCheck" [ref=f2e496]
                - paragraph [ref=f2e497]:
                  - strong [ref=f2e498]: Find what your AI-built app leaks — before you ship.
                - paragraph [ref=f2e499]:
                  - text: Works with Claude Code, OpenCode, Cursor, or any MCP-compatible agent — it's a standard
                  - link "Model Context Protocol" [ref=f2e500] [cursor=pointer]:
                    - /url: https://modelcontextprotocol.io
                  - text: server, not a Claude-only tool.
                - paragraph [ref=f2e501]:
                  - link [ref=f2e502] [cursor=pointer]:
                    - /url: https://github.com/noureldeensalama/shipcheck/actions/workflows/ci.yml
                    - img "CI" [ref=f2e503]
                  - link [ref=f2e504] [cursor=pointer]:
                    - /url: https://www.npmjs.com/package/shipcheck-mcp
                    - img "npm" [ref=f2e505]
                  - link [ref=f2e506] [cursor=pointer]:
                    - /url: /noureldeensalama/shipcheck/blob/main/LICENSE
                    - img "license" [ref=f2e507]
              - separator [ref=f2e508]
              - paragraph [ref=f2e509]: AI coding agents happily ship apps that leak API keys, pull in GPL-licensed packages, leave admin routes open to the internet, collect emails with no privacy policy, or touch raw card numbers — because "does it run" and "is this okay to ship" are different questions, and your agent only answers the first one.
              - paragraph [ref=f2e510]:
                - text: ShipCheck answers the second one. It runs five fast, deterministic checks over your project and explains every finding in plain words — what's wrong, why it matters for
                - emphasis [ref=f2e511]: you
                - text: ", and exactly how to fix it. No security background needed."
              - blockquote [ref=f2e512]:
                - paragraph [ref=f2e513]:
                  - strong [ref=f2e514]: "Honest by design:"
                  - text: ShipCheck flags risky
                  - emphasis [ref=f2e515]: patterns
                  - text: . It is not a legal review and not a guarantee. A clean scan means nothing matched these specific checks — nothing more. See
                  - link "PRD.md" [ref=f2e516] [cursor=pointer]:
                    - /url: /noureldeensalama/shipcheck/blob/main/PRD.md
                  - text: §2 for the full non-goals.
              - generic [ref=f2e517]:
                - heading "Two tools, two moments" [level=2] [ref=f2e518]
                - 'link "Permalink: Two tools, two moments" [ref=f2e519] [cursor=pointer]':
                  - /url: "#two-tools-two-moments"
              - table [ref=f2e523]:
                - rowgroup [ref=f2e524]:
                  - row [ref=f2e525]:
                    - columnheader "Tool" [ref=f2e526]
                    - columnheader "When" [ref=f2e527]
                    - columnheader "What it scans" [ref=f2e528]
