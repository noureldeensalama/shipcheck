              - blockquote [ref=f2e585]:
                - paragraph [ref=f2e586]:
                  - strong [ref=f2e587]: "[critical] lib/firebase_options.dart"
                  - text: — Possible Google API Key found in code that runs on people's devices.
                - paragraph [ref=f2e588]:
                  - strong [ref=f2e589]: "Why this matters:"
                  - text: This key travels inside your app to every user's phone or browser. Anyone can copy it out and use it as if they were you — spending your money or reading your data.
                - paragraph [ref=f2e590]:
                  - strong [ref=f2e591]: "The fix:"
                  - text: Move the key into a separate secrets file that never becomes part of the project, load it at startup, then get a new key from the provider's dashboard — treat this one as stolen.
