                    - cell "The whole repository, including git history for deleted-but-never-rotated secrets." [ref=f2e544]
              - paragraph [ref=f2e545]:
                - text: "The bundled skill teaches your agent the habit:"
                - code [ref=f2e546]: scan_diff
                - text: before commits,
                - code [ref=f2e547]: scan_repo
                - text: before launch.
              - generic [ref=f2e548]:
                - heading "Works with your stack" [level=2] [ref=f2e549]
                - 'link "Permalink: Works with your stack" [ref=f2e550] [cursor=pointer]':
