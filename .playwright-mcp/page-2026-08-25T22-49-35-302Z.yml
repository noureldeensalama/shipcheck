                - rowgroup [ref=f2e559]:
                  - row [ref=f2e560]:
                    - cell "🔑 Exposed secrets" [ref=f2e561]
                    - cell [ref=f2e562]:
                      - text: Any language — 15+ key formats (Stripe, OpenAI, Anthropic, OpenRouter, Supabase service-role, AWS, GitHub, Google, Slack, SendGrid, Resend, private keys, DB URLs), committed
                      - code [ref=f2e563]: .env
                      - text: files, plus
                      - strong [ref=f2e564]: deleted-but-never-rotated keys found in git history
                  - row [ref=f2e565]:
                    - cell "⚖️ Copyleft licenses" [ref=f2e566]
                    - cell "npm · PyPI · pub.dev · crates.io · RubyGems · Composer" [ref=f2e567]
                  - row [ref=f2e568]:
                    - cell "🚪 Unlocked routes" [ref=f2e569]
                    - cell "Express · FastAPI · Flask · Next.js (App + Pages Router) · gin/echo/fiber-style Go · Laravel · Spring Boot" [ref=f2e570]
                  - row [ref=f2e571]:
                    - cell "🕵️ PII without a privacy policy" [ref=f2e572]
                    - cell "Google Analytics, PostHog, Meta Pixel, Hotjar, Clarity, Amplitude, Mixpanel, Segment, Firebase, signup/auth forms, phone inputs" [ref=f2e573]
                  - row [ref=f2e574]:
                    - cell "💳 Card data handling" [ref=f2e575]
                    - cell "Raw card/CVV fields in JS/TS/Dart/Python/HTML vs. processor SDKs (Stripe Elements & friends)" [ref=f2e576]
              - paragraph [ref=f2e577]:
                - text: Every summary tells you which stacks it detected (
                - code [ref=f2e578]: project_types
                - text: ) and warns you honestly when a detected stack isn't fully covered (
                - code [ref=f2e579]: coverage_caveat
                - text: ) instead of implying everything is fine.
              - generic [ref=f2e580]:
                - heading "What a finding looks like" [level=2] [ref=f2e581]
